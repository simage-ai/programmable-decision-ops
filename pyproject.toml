[project]
name = "programmable-decision-ops"
version = "0.1.0"
description = "Decisions as programs: a LinkML decision schema, a deterministic kernel and agent skills for auditable, refreshable decisions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
pdo = "pdo.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
figures = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "linkml==1.11.1",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdo"]

# A pip-installed pdo (e.g. inside an agent harness) needs the schema and the examples.
[tool.hatch.build.targets.wheel.force-include]
"schema" = "pdo/schema"
"examples" = "pdo/examples_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not slow'"
markers = [
    "live: calls a hosted model with real keys (run with -m live)",
    "slow: subprocess and end-to-end checks (run with -m slow)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["src/pdo/model.py", "src/pdo/identity_slots.py", "project/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # typer.Option defaults are idiomatic
