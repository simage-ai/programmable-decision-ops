# Synthetic evidence and the observations taken from it. Range is not observed: spec:range-model
# computes it from usable fuel, fuel economy and the terrain assumption (A 320, B 360, C 380 mi).
#
# The configuration sheets (docs/configuration-sheets.pdf) and the phase 1 reliability report
# (docs/reliability-test-report.docx) are indexed documents: each value taken from them carries a locator
# (section, page, quote, digests) computed by pdo docs locate, and pdo validate checks every locator
# against its document. The supplier quotes are cited but not indexed.
