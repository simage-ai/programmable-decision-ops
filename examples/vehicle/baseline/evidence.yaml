  - {id: obs:A.cost, alternative: alt:A, measure: meas:unit-cost, value: 1.00, unit: MUSD, evidence: ev:cost-A}
  - {id: obs:A.reliability, alternative: alt:A, measure: meas:reliability, value: 0.97, unit: "1", evidence: ev:reliability-A}
  - {id: obs:B.tank, alternative: alt:B, measure: meas:tank-capacity, value: 45, unit: gal, evidence: ev:design-B}
