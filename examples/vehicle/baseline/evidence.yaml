# Synthetic evidence and the observations taken from it. Range is not observed: spec:range-model
# computes it from usable fuel, fuel economy and the terrain assumption (A 320, B 360, C 380 mi).
evidence_items:
  - {id: ev:design-A, name: Configuration sheet A, evidence_kind: specification,
     source_ref: "Synthetic configuration sheet, vehicle A, rev 1", document_version: "1",
     issued_on: 2026-11-02, owner_role: role:systems-engineer}
  - {id: ev:cost-A, name: Supplier quote A, evidence_kind: cost estimate,
     source_ref: "Synthetic supplier quote, vehicle A, Q4 2026", document_version: "1",
     issued_on: 2026-12-01, valid_until: 2027-12-31, owner_role: role:cost-analyst}
  - {id: ev:reliability-A, name: Reliability test report A, evidence_kind: test report,
     source_ref: "Synthetic reliability growth test, vehicle A, phase 1", document_version: "1",
     issued_on: 2026-12-10, owner_role: role:test-engineer}
  - {id: ev:design-B, name: Configuration sheet B, evidence_kind: specification,
     source_ref: "Synthetic configuration sheet, vehicle B, rev 1", document_version: "1",
     issued_on: 2026-11-02, owner_role: role:systems-engineer}
  - {id: ev:cost-B, name: Supplier quote B, evidence_kind: cost estimate,
     source_ref: "Synthetic supplier quote, vehicle B, Q4 2026", document_version: "1",
     issued_on: 2026-12-01, valid_until: 2027-12-31, owner_role: role:cost-analyst}
  - {id: ev:reliability-B, name: Reliability test report B, evidence_kind: test report,
     source_ref: "Synthetic reliability growth test, vehicle B, phase 1", document_version: "1",
     issued_on: 2026-12-10, owner_role: role:test-engineer}
  - {id: ev:design-C, name: Configuration sheet C, evidence_kind: specification,
     source_ref: "Synthetic configuration sheet, vehicle C, rev 1", document_version: "1",
     issued_on: 2026-11-02, owner_role: role:systems-engineer}
  - {id: ev:cost-C, name: Supplier quote C, evidence_kind: cost estimate,
     source_ref: "Synthetic supplier quote, vehicle C, Q4 2026", document_version: "1",
     issued_on: 2026-12-01, valid_until: 2027-12-31, owner_role: role:cost-analyst}
  - {id: ev:reliability-C, name: Reliability test report C, evidence_kind: test report,
     source_ref: "Synthetic reliability growth test, vehicle C, phase 1", document_version: "1",
     issued_on: 2026-12-10, owner_role: role:test-engineer}

observations:
