  ep:b4:
    parent: ep:e00
    outcome: empty_feasible_set
    recommended: []
    feasible: []
    infeasible: [alt:A, alt:B, alt:C]
    unresolved: []
    utilities: {alt:A: 0.466667, alt:B: 0.533333, alt:C: 0.62}
    readiness: blocked
    failed_conditions: [rc:recommendation-exists, rc:unique-recommendation]
    unknown_conditions: [bc:framing-review]
    actionable: false
    note: Brief branch, min range 370; A (g = +50) and B (g = +10) fail range, C fails reliability; no recommendation.
