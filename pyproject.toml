[project]
name = "programmable-decision-ops"
version = "0.1.0"
description = "Decisions as programs: a LinkML decision schema, a deterministic kernel and agent skills for auditable, refreshable decisions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
pdo = "pdo.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
    "linkml-runtime>=1.8",  # pdo_describe_schema reads the LinkML schema itself
    "jsonschema>=4",        # Decision Package records are validated against the published JSON Schema
]
figures = [
    "matplotlib>=3.8",
]
docs = [
    "python-docx>=1.1",  # Word reports: sections from heading styles, tables as rows
    "pypdf>=5",          # PDF reports: sections from the outline, else numbered headings
]

[dependency-groups]
dev = [
    "linkml==1.11.1",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdo"]

# A pip-installed pdo (e.g. inside an agent harness) needs the schema and the examples.
[tool.hatch.build.targets.wheel.force-include]
"schema" = "pdo/schema"
"examples" = "pdo/examples_data"
"project/jsonschema" = "pdo/jsonschema"
"skills" = "pdo/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not slow'"
markers = [
    "live: calls a hosted model with real keys (run with -m live)",
    "slow: subprocess and end-to-end checks (run with -m slow)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["src/pdo/model.py", "src/pdo/identity_slots.py", "project/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["B008"]  # typer.Option defaults are idiomatic
